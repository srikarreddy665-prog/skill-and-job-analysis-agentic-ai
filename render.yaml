services:
  - type: web
    name: nexus-agentic-ai
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_FLASH_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_PRO_MODEL
        value: gemini-3.5-flash
